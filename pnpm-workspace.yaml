allowBuilds:
  esbuild: true
  workerd: true

minimumReleaseAgeExclude:
  - "@cloudflare/vitest-plugin@1.4.9"
  - miniflare@5.20261023.1-beta
  - wrangler@4.154.0

# Cloudflare's local-dev packages pin vulnerable patch releases of these two
# libraries (see `pnpm audit`). Force the patched versions; remove once upstream catches up.
overrides:
  undici: ^7.30.1
  zod: ^4.6.7
